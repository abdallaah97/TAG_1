name: Deploy API

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore API/API.csproj

      - name: Build
        run: dotnet build API/API.csproj -c Release --no-restore

      - name: Test
        run: |
          projects=$(find . -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*" \
            -exec grep -l "Microsoft.NET.Test.Sdk" {} + 2>/dev/null || true)
          if [ -z "$projects" ]; then
            echo "no test projects in the solution yet - nothing to run"
            exit 0
          fi
          for p in $projects; do
            echo "::group::$p"
            dotnet test "$p" -c Release
            echo "::endgroup::"
          done

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      TARGET: ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}
      SSH_OPTS: -o StrictHostKeyChecking=accept-new

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish API/API.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o publish

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Deploy
        run: |
          sshpass -e ssh $SSH_OPTS "$TARGET" "systemctl stop tag-api"

          sshpass -e rsync -az --delete --no-owner --no-group \
            -e "ssh $SSH_OPTS" \
            publish/ "$TARGET:/var/www/tag/tag-api/"

          sshpass -e ssh $SSH_OPTS "$TARGET" \
            "chown -R www-data:www-data /var/www/tag/tag-api && \
             chmod +x /var/www/tag/tag-api/API && \
             systemctl start tag-api"

      - name: Health check
        run: |
          sshpass -e ssh $SSH_OPTS "$TARGET" \
            'for i in $(seq 1 30); do
               c=$(curl -o /dev/null -s -w "%{http_code}" --max-time 5 http://127.0.0.1:5080/swagger/index.html || true)
               [ -n "$c" ] && [ "$c" != "000" ] && { echo "API is up (HTTP $c)"; exit 0; }
               sleep 2
             done
             echo "API did not respond"
             journalctl -u tag-api -n 40 --no-pager
             exit 1'
