name: Deploy API

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SRV_HOST: ${{ secrets.SERVER_HOST }}
      SRV_USER: ${{ secrets.SERVER_USERNAME }}
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      APP_ROOT: /var/www/tag
      APP_DIR: /var/www/tag/tag-api
      BUILD_DIR: /var/www/tag/build
      ENV_FILE: /etc/tag-api.env
      SERVICE: tag-api
      RUN_USER: www-data
      PORT: "5080"
      DB_NAME: TAG
      REDIS_DB: "9"
      RATE_LIMIT: "100"
      MSSQL_CONTAINER: tag-mssql
      MSSQL_PORT: "1433"
      MSSQL_VOLUME: tag-mssql-data

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained linux-x64
        run: |
          dotnet publish API/API.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o publish
          du -sh publish

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Provision server
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          b64() { printf "%s" "$1" | base64 -w0; }
          {
            echo "export APP_ROOT='$APP_ROOT'"
            echo "export APP_DIR='$APP_DIR'"
            echo "export BUILD_DIR='$BUILD_DIR'"
            echo "export ENV_FILE='$ENV_FILE'"
            echo "export SERVICE='$SERVICE'"
            echo "export RUN_USER='$RUN_USER'"
            echo "export PORT='$PORT'"
            echo "export DB_NAME='$DB_NAME'"
            echo "export REDIS_DB='$REDIS_DB'"
            echo "export RATE_LIMIT='$RATE_LIMIT'"
            echo "export MSSQL_CONTAINER='$MSSQL_CONTAINER'"
            echo "export MSSQL_PORT='$MSSQL_PORT'"
            echo "export MSSQL_VOLUME='$MSSQL_VOLUME'"
            echo "export MSSQL_SA_PASSWORD=\"\$(echo '$(b64 "$MSSQL_SA_PASSWORD")' | base64 -d)\""
            echo "export JWT_KEY=\"\$(echo '$(b64 "$JWT_KEY")' | base64 -d)\""
            echo "export SEED_ADMIN_PASSWORD=\"\$(echo '$(b64 "$SEED_ADMIN_PASSWORD")' | base64 -d)\""
            cat deploy/provision.sh
          } | sshpass -e ssh -o StrictHostKeyChecking=accept-new "$SRV_USER@$SRV_HOST" "bash -s"

      - name: Upload build
        run: |
          sshpass -e rsync -az --delete --no-owner --no-group \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            publish/ "$SRV_USER@$SRV_HOST:$BUILD_DIR/"

      - name: Swap release and restart
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$SRV_USER@$SRV_HOST" \
            APP_DIR="$APP_DIR" BUILD_DIR="$BUILD_DIR" SERVICE="$SERVICE" RUN_USER="$RUN_USER" bash -s <<'REMOTE'
          set -euo pipefail
          rm -rf "${APP_DIR}-prev"
          if [ -n "$(ls -A "$APP_DIR" 2>/dev/null)" ]; then
            cp -a "$APP_DIR" "${APP_DIR}-prev"
            echo "previous release kept at ${APP_DIR}-prev"
          fi
          systemctl stop "$SERVICE" || true
          rsync -a --delete "$BUILD_DIR/" "$APP_DIR/"
          chown -R "$RUN_USER":"$RUN_USER" "$APP_DIR"
          chmod +x "$APP_DIR/API"
          systemctl start "$SERVICE"
          REMOTE

      - name: Health check
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$SRV_USER@$SRV_HOST" \
            SERVICE="$SERVICE" PORT="$PORT" bash -s <<'REMOTE'
          set -uo pipefail
          for i in $(seq 1 45); do
            code=$(curl -o /dev/null -s -w '%{http_code}' --max-time 5 "http://127.0.0.1:${PORT}/swagger/index.html" || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "API is responding on port ${PORT} (HTTP ${code})"
              exit 0
            fi
            sleep 2
          done
          echo "API did not respond within 90 seconds"
          systemctl status "$SERVICE" --no-pager -l | head -20
          journalctl -u "$SERVICE" -n 80 --no-pager
          exit 1
          REMOTE

      - name: Summary
        run: |
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- commit: \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- swagger: http://${SRV_HOST}:${PORT}/swagger" >> $GITHUB_STEP_SUMMARY
