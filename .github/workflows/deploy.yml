name: Deploy API

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SRV_HOST: ${{ secrets.SERVER_HOST }}
      SRV_USER: ${{ secrets.SERVER_USERNAME }}
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      APP_DIR: /var/www/tag/tag-api
      BUILD_DIR: /var/www/tag/build
      SERVICE: tag-api
      PORT: "5080"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained linux-x64
        run: |
          dotnet publish API/API.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o publish
          du -sh publish

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload build
        run: |
          sshpass -e rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            publish/ "$SRV_USER@$SRV_HOST:$BUILD_DIR/"

      - name: Swap release and restart
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$SRV_USER@$SRV_HOST" \
            APP_DIR="$APP_DIR" BUILD_DIR="$BUILD_DIR" SERVICE="$SERVICE" bash -s <<'REMOTE'
          set -euo pipefail
          rm -rf "${APP_DIR}-prev"
          if [ -n "$(ls -A "$APP_DIR" 2>/dev/null)" ]; then
            cp -a "$APP_DIR" "${APP_DIR}-prev"
            echo "previous release kept at ${APP_DIR}-prev"
          fi
          systemctl stop "$SERVICE" || true
          rsync -a --delete "$BUILD_DIR/" "$APP_DIR/"
          chown -R www-data:www-data "$APP_DIR"
          chmod +x "$APP_DIR/API"
          systemctl start "$SERVICE"
          REMOTE

      - name: Health check
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$SRV_USER@$SRV_HOST" \
            SERVICE="$SERVICE" PORT="$PORT" bash -s <<'REMOTE'
          set -uo pipefail
          for i in $(seq 1 45); do
            code=$(curl -o /dev/null -s -w '%{http_code}' --max-time 5 "http://127.0.0.1:${PORT}/swagger/index.html" || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "API is responding on port ${PORT} (HTTP ${code})"
              exit 0
            fi
            sleep 2
          done
          echo "API did not respond within 90 seconds"
          systemctl status "$SERVICE" --no-pager -l | head -20
          journalctl -u "$SERVICE" -n 80 --no-pager
          exit 1
          REMOTE

      - name: Summary
        run: |
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- commit: \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- swagger: http://${SRV_HOST}:${PORT}/swagger" >> $GITHUB_STEP_SUMMARY
