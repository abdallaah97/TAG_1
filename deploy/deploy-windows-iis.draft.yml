name: Deploy API - Windows Server IIS (draft)

on:
  workflow_dispatch:

concurrency:
  group: deploy-api-iis
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore API/API.csproj

      - name: Build
        run: dotnet build API/API.csproj -c Release --no-restore

      - name: Test
        run: |
          projects=$(find . -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*" \
            -exec grep -l "Microsoft.NET.Test.Sdk" {} + 2>/dev/null || true)
          if [ -z "$projects" ]; then
            echo "no test projects in the solution yet - nothing to run"
            exit 0
          fi
          for p in $projects; do
            echo "::group::$p"
            dotnet test "$p" -c Release
            echo "::endgroup::"
          done

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.WIN_SERVER_PASSWORD }}
      TARGET: ${{ secrets.WIN_SERVER_USERNAME }}@${{ secrets.WIN_SERVER_HOST }}
      SSH_OPTS: -o StrictHostKeyChecking=accept-new

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish API/API.csproj -c Release -o publish

          if [ ! -f publish/web.config ]; then
            echo "web.config was not generated - IIS cannot host this output"
            exit 1
          fi

          cd publish && zip -qr ../release.zip . && cd ..
          ls -lh release.zip

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload
        run: sshpass -e scp $SSH_OPTS release.zip "$TARGET:release.zip"

      - name: Swap behind app_offline
        run: |
          sshpass -e ssh $SSH_OPTS "$TARGET" "powershell -NoProfile -Command -" <<'PS'
          $ErrorActionPreference = 'Stop'

          $site    = 'C:\inetpub\tag-api'
          $archive = Join-Path $env:USERPROFILE 'release.zip'
          $offline = Join-Path $site 'app_offline.htm'

          New-Item -ItemType Directory -Path $site -Force | Out-Null

          try {
              Set-Content -Path $offline -Encoding UTF8 -Value '<html><body><h1>Deploying</h1></body></html>'
              Start-Sleep -Seconds 3

              Get-ChildItem -Path $site -Force |
                  Where-Object { $_.Name -ne 'app_offline.htm' } |
                  Remove-Item -Recurse -Force

              Expand-Archive -Path $archive -DestinationPath $site -Force
              Remove-Item $archive -Force
          }
          finally {
              if (Test-Path $offline) { Remove-Item $offline -Force }
          }

          Write-Output "files in place at $site"
          PS

      - name: Health check
        run: |
          sshpass -e ssh $SSH_OPTS "$TARGET" "powershell -NoProfile -Command -" <<'PS'
          $url = 'http://localhost/swagger/index.html'

          foreach ($i in 1..30) {
              try {
                  $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
                  Write-Output "API is up (HTTP $($r.StatusCode))"
                  exit 0
              } catch {
                  $code = $_.Exception.Response.StatusCode.value__
                  if ($code) {
                      Write-Output "API is up (HTTP $code)"
                      exit 0
                  }
              }
              Start-Sleep -Seconds 2
          }

          Write-Output 'API did not respond'

          Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -like '*AspNetCore*' -or $_.ProviderName -like '*IIS*' } |
              Select-Object -First 10 TimeCreated, ProviderName, Message |
              Format-List

          exit 1
          PS
