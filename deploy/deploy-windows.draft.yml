name: Deploy API - Windows Server (draft)

on:
  workflow_dispatch:

concurrency:
  group: deploy-api-windows
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore API/API.csproj

      - name: Build
        run: dotnet build API/API.csproj -c Release --no-restore

      - name: Test
        run: |
          projects=$(find . -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*" \
            -exec grep -l "Microsoft.NET.Test.Sdk" {} + 2>/dev/null || true)
          if [ -z "$projects" ]; then
            echo "no test projects in the solution yet - nothing to run"
            exit 0
          fi
          for p in $projects; do
            echo "::group::$p"
            dotnet test "$p" -c Release
            echo "::endgroup::"
          done

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.WIN_SERVER_PASSWORD }}
      TARGET: ${{ secrets.WIN_SERVER_USERNAME }}@${{ secrets.WIN_SERVER_HOST }}
      SSH_OPTS: -o StrictHostKeyChecking=accept-new

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish API/API.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -o publish
          cd publish && zip -qr ../release.zip . && cd ..
          ls -lh release.zip

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload
        run: sshpass -e scp $SSH_OPTS release.zip "$TARGET:release.zip"

      - name: Stop, swap, start
        run: |
          sshpass -e ssh $SSH_OPTS "$TARGET" "powershell -NoProfile -Command -" <<'PS'
          $ErrorActionPreference = 'Stop'

          $app     = 'C:\apps\tag-api'
          $service = 'tag-api'
          $archive = Join-Path $env:USERPROFILE 'release.zip'

          if (Get-Service -Name $service -ErrorAction SilentlyContinue) {
              Stop-Service -Name $service -Force
              (Get-Service $service).WaitForStatus('Stopped', '00:01:00')
          }

          New-Item -ItemType Directory -Path $app -Force | Out-Null
          Get-ChildItem -Path $app -Force | Remove-Item -Recurse -Force

          Expand-Archive -Path $archive -DestinationPath $app -Force
          Remove-Item $archive -Force

          Start-Service -Name $service
          Write-Output "service state: $((Get-Service $service).Status)"
          PS

      - name: Health check
        run: |
          sshpass -e ssh $SSH_OPTS "$TARGET" "powershell -NoProfile -Command -" <<'PS'
          $url = 'http://127.0.0.1:5080/swagger/index.html'

          foreach ($i in 1..30) {
              try {
                  $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
                  Write-Output "API is up (HTTP $($r.StatusCode))"
                  exit 0
              } catch {
                  $code = $_.Exception.Response.StatusCode.value__
                  if ($code) {
                      Write-Output "API is up (HTTP $code)"
                      exit 0
                  }
              }
              Start-Sleep -Seconds 2
          }

          Write-Output 'API did not respond'
          Get-EventLog -LogName Application -Source 'tag-api' -Newest 20 -ErrorAction SilentlyContinue |
              Format-List TimeGenerated, EntryType, Message
          exit 1
          PS
